services:
  frontend:
    build: .
    container_name: logitrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: logitrack-api
    ports:
      - "3001:3001"
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: logitrack-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api